target-version = "py312"
line-length = 120

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "FURB",
]

ignore = [
    "E501",
]

[lint.isort]
combine-as-imports = true
forced-separate = ["tests"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"