name: Pytest & lint check on PR

on:
    pull_request:
        branches:
            - '**'

jobs:
    test:
        runs-on: ubuntu-latest
    
        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
                cache-dependency-glob:
                    pyproject.toml
                    uv.lock

            - name: Install dependencies
              run: uv sync

            - name: Run lint
              run: uv run ruff check .
            
            - name: Run tests
              run: uv run pytest
        
        